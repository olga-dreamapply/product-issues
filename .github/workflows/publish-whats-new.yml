name: Sync What's New Feed

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]

jobs:
  sync-whats-new:
    runs-on: ubuntu-latest
    permissions:
      issues: read        # Enables access to read private repository issues
      contents: read
    steps:
      - name: Checkout Public Page Repo
        uses: actions/checkout@v4
        with:
          repository: 'olga-dreamapply/whats-new-page'
          token: ${{ secrets.PUBLIC_DOCS_PAT }}
          ref: 'main'

      - name: Fetch and Process Qualified Issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Fetch closed issues labeled with both 'in production' and 'what's new'
          raw_issues=$(gh issue list --repo "$REPO" --state closed --json number,title,labels,closedAt,body)

          # Parse, filter, and structure the data into JSON using jq
          echo "$raw_issues" | jq '
            map(select(
              (.labels | map(.name) | contains(["in production"])) and
              (.labels | map(.name) | contains(["what'\''s new"]))
            )) | map({
              id: .number,
              title: .title | gsub("\\[[^\\]]*\\]"; "") | gsub("^\\s+|\\s+$"; ""),
              closedAt: .closedAt,
              category: (
                [.labels[].name | select(startswith("Category:")) | split(":")[1] | gsub("^\\s+|\\s+$"; "")] | first // "General"
              ),
              resolutionText: (
                if .body then
                  (.body | capture("### Resolution Details\\s*(?<text>[\\s\\S]*?)(###|$)") | .text | gsub("^\\s+|\\s+$"; ""))
                else "" end
              )
            })
          ' > data.json

      - name: Commit and Push Updated Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "sync: update whats-new data ledger"
          branch: main
