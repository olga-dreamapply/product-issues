name: Sync What's New Feed

on:
  issues:
    types: [edited, closed, reopened, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]

jobs:
  sync-whats-new:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: read

    steps:
      - name: Checkout Public Page Repo
        uses: actions/checkout@v4
        with:
          repository: 'olga-dreamapply/whats-new-page'
          token: ${{ secrets.PUBLIC_DOCS_PAT }}
          ref: 'main'
          fetch-depth: 0

      - name: Fetch and Process Qualified Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Fetch closed issues including comments
          raw_issues=$(gh issue list --repo "$REPO" --state closed --limit 1000 --json number,title,labels,closedAt,body,comments)

          echo "$raw_issues" | jq '
            map(
              . as $item |
              ($item.labels | map(.name)) as $labels |

              # Safely extract comment bodies array
              (($item.comments // []) | map(.body // "")) as $commentBodies |

              # 1. Combine issue body and all comments into a single string
              ([$item.body // ""] + $commentBodies) | join("\n\n---\n\n") as $fullContent |

              # 2. Extract content under Resolution Details header
              ($fullContent | gsub("\r"; "") | split("\n") | 
                reduce .[] as $line ({found: false, text: []};
                  if $line | test("^#+\\s*Resolution Details"; "i") then
                    .found = true
                  elif .found and ($line | test("^#+\\s+")) then
                    .found = false
                  elif .found then
                    .text += [$line]
                  else
                    .
                  end
                ) | .text | join("\n") | gsub("^\\s+|\\s+$"; "")
              ) as $resText |

              # Filter: Must contain both required labels
              select(
                ($labels | index("in production")) != null and
                ($labels | index("what'\''s new")) != null
              ) | {
                id: .number,
                title: (.title | gsub("\\[[^\\]]*\\]"; "") | gsub("^\\s+|\\s+$"; "")),
                closedAt: .closedAt,
                category: (
                  [$item.labels[].name | select(startswith("Category:")) | split(":")[1] | gsub("^\\s+|\\s+$"; "")] | first // "General"
                ),
                resolutionText: $resText
              }
            )
          ' > data.json

      - name: Commit and Push Updated Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "sync: update whats-new data ledger"
          branch: main
          file_pattern: 'data.json'
