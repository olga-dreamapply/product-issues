name: Sync What's New Feed

on:
  issues:
    types: [edited, closed, reopened, labeled, unlabeled]

jobs:
  sync-whats-new:
    runs-on: ubuntu-latest

    if: >-
      contains(github.event.issue.labels.*.name, 'what''s new') ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'what''s new')

    permissions:
      contents: read
      issues: read

    steps:
      - name: Checkout Public Page Repo
        uses: actions/checkout@v4
        with:
          repository: 'olga-dreamapply/whats-new-page'
          token: ${{ secrets.PUBLIC_DOCS_PAT }}
          ref: 'main'
          fetch-depth: 0

      - name: Fetch and Process Qualified Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          raw_issues=$(gh issue list --repo "$REPO" --state closed --limit 1000 --json number,title,labels,closedAt,body)

          echo "$raw_issues" | jq '
            map(
              . as $item |
              ($item.labels | map(.name)) as $labels |
              
              # Normalize line endings and extract Resolution Details
              ($item.body // "" | gsub("\r"; "") | split("\n") | 
                reduce .[] as $line ({found: false, text: []};
                  if $line | test("^#+\\s*Resolution Details") then
                    .found = true
                  elif .found and ($line | test("^#+\\s+")) then
                    .found = false
                  elif .found then
                    .text += [$line]
                  else
                    .
                  end
                ) | .text | join("\n") | gsub("^\\s+|\\s+$"; "")
              ) as $resText |
              
              select(
                ($labels | index("in production")) != null and
                ($labels | index("what'\''s new")) != null
              ) | {
                id: .number,
                title: (.title | gsub("\\[[^\\]]*\\]"; "") | gsub("^\\s+|\\s+$"; "")),
                closedAt: .closedAt,
                category: (
                  [$item.labels[].name | select(startswith("Category:")) | split(":")[1] | gsub("^\\s+|\\s+$"; "")] | first // "General"
                ),
                resolutionText: $resText
              }
            )
          ' > data.json

      - name: Commit and Push Updated Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "sync: update whats-new data ledger"
          branch: main
          file_pattern: 'data.json'
