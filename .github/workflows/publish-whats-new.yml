name: Sync What's New Feed

on:
  issues:
    types: [closed, reopened, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]

concurrency:
  group: sync-whats-new-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-whats-new:
    runs-on: ubuntu-latest

    # GUARD CLAUSE: Only run if the issue has or had relevant labels, or was reopened
    if: >-
      github.event.action == 'reopened' ||
      contains(github.event.issue.labels.*.name, 'what''s new') ||
      contains(github.event.issue.labels.*.name, 'in production') ||
      contains(github.event.issue.labels.*.name, 'Status: Roadmap') ||
      github.event.label.name == 'what''s new' ||
      github.event.label.name == 'in production' ||
      github.event.label.name == 'Status: Roadmap'

    permissions:
      contents: read
      issues: read

    steps:
      - name: Checkout Public Page Repo
        uses: actions/checkout@v4
        with:
          repository: 'olga-dreamapply/whats-new-page'
          token: ${{ secrets.PUBLIC_DOCS_PAT }}
          ref: 'main'
          fetch-depth: 0

      - name: Fetch and Process Qualified Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # OPTIMIZATION: Fetch ONLY issues labeled "what's new" rather than all 1000 issues
          raw_issues=$(gh issue list --repo "$REPO" --label "what's new" --state all --limit 500 --json number,state,title,labels,closedAt,updatedAt,body,comments)

          echo "$raw_issues" | jq '
            map(
              . as $item |
              ($item.labels | map(.name)) as $labels |

              # 1. Normalize line endings (CRLF -> LF) and collect all text blocks
              (
                [
                  ($item.body // "" | gsub("\r\n"; "\n"))
                ] + 
                (
                  if ($item.comments != null and ($item.comments | length > 0)) then
                    [$item.comments[].body // "" | gsub("\r\n"; "\n")]
                  else
                    []
                  end
                )
              ) as $textBlocks |

              # 2. Extract content under "Resolution Details"
              (
                $textBlocks | map(
                  select(test("(?i)#+\\s*Resolution\\s+Details")) |
                  sub("(?s).*?(?i)#+\\s*Resolution\\s+Details:?\\s*\n?"; "") |
                  sub("(?s)\n#{1,2}\\s+[^#].*"; "") |
                  gsub("^\\s+|\\s+$"; "")
                ) | first // ""
              ) as $rawResText |

              # 3. Extract [Module] tag from title
              (
                if ($item.title | test("^\\[[^\\]]+\\]")) then
                  ($item.title | capture("^\\[(?<mod>[^\\]]+)\\]") | .mod | gsub("^\\s+|\\s+$"; ""))
                else
                  null
                end
              ) as $moduleTag |

              # 4. Clean base title
              ($item.title | gsub("^\\[[^\\]]*\\]"; "") | gsub("^\\s+|\\s+$"; "")) as $cleanTitle |

              # 5. Extract custom display title if rawResText starts with a heading line
              (
                if ($rawResText != "" and ($rawResText | test("^#+\\s+"; "m"))) then
                  ($rawResText | capture("^#+\\s+(?<customTitle>[^\n]+)") | .customTitle | gsub("^\\s+|\\s+$"; ""))
                else
                  $cleanTitle
                end
              ) as $displayTitle |

              # 6. Extract body content
              (
                if ($rawResText != "" and ($rawResText | test("^#+\\s+"; "m"))) then
                  ($rawResText | sub("^#+\\s+[^\n]+\n?"; "") | gsub("^\\s+|\\s+$"; ""))
                else
                  $rawResText
                end
              ) as $resBody |

              # 7. Extract Category labels
              (
                [$item.labels[].name | select(startswith("Category:")) | split(":")[1] | gsub("^\\s+|\\s+$"; "")]
              ) as $cats |

              # 8. Qualification checks
              (($labels | index("what'\''s new")) != null) as $hasWhatsNew |
              (($labels | index("in production")) != null) as $hasInProduction |
              (($labels | index("Status: Roadmap")) != null) as $hasRoadmap |

              {
                id: .number,
                title: $displayTitle,
                module: $moduleTag,
                closedAt: (if $item.closedAt != null then $item.closedAt else $item.updatedAt end),
                inProductionAt: (if $item.closedAt != null then $item.closedAt else $item.updatedAt end),
                categories: (if ($cats | length) > 0 then $cats else ["General"] end),
                resolutionText: $resBody,
                isPublished: ($hasWhatsNew and $hasInProduction and $item.state == "CLOSED"),
                isRoadmap: ($hasWhatsNew and $hasRoadmap)
              }
            ) | {
              published: map(select(.isPublished) | del(.isPublished, .isRoadmap)),
              roadmap: map(select(.isRoadmap) | del(.isPublished, .isRoadmap))
            }
          ' > data.json

      - name: Commit and Push Updated Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "sync: update whats-new data ledger"
          branch: main
          file_pattern: 'data.json'
