name: Sync What's New Feed

on:
  issues:
    types: [closed, reopened, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]

concurrency:
  group: sync-whats-new-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-whats-new:
    runs-on: ubuntu-latest

    if: >-
      github.event.action == 'reopened' ||
      contains(github.event.issue.labels.*.name, 'what''s new') ||
      contains(github.event.issue.labels.*.name, 'in production') ||
      contains(github.event.issue.labels.*.name, 'Status: Roadmap') ||
      github.event.label.name == 'what''s new' ||
      github.event.label.name == 'in production' ||
      github.event.label.name == 'Status: Roadmap'

    permissions:
      contents: read
      issues: read

    steps:
      - name: Checkout Public Page Repo
        uses: actions/checkout@v4
        with:
          repository: 'olga-dreamapply/whats-new-page'
          token: ${{ secrets.PUBLIC_DOCS_PAT }}
          ref: 'main'
          fetch-depth: 0

      - name: Fetch and Process Qualified Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # 1. Fetch qualified candidate issues labeled "what's new"
          raw_issues=$(gh issue list --repo "$REPO" --label "what's new" --state all --limit 500 --json number,state,title,labels,closedAt,updatedAt,body,comments)

          # 2. Extract issue numbers that have the "in production" label
          qualified_numbers=$(echo "$raw_issues" | jq -r '.[] | select(.labels[].name == "in production") | .number')

          # 3. Build a map of issue number -> exact "in production" label timestamp
          label_dates="{}"
          if [ -n "$qualified_numbers" ]; then
            for num in $qualified_numbers; do
              # Fetch issue timeline events to find the exact "in production" labeled timestamp
              in_prod_time=$(gh api "repos/$REPO/issues/$num/timeline" --paginate --jq 'map(select(.event == "labeled" and .label.name == "in production")) | last | .created_at // empty')
              if [ -n "$in_prod_time" ]; then
                label_dates=$(echo "$label_dates" | jq --arg n "$num" --arg t "$in_prod_time" '.[$n] = $t')
              fi
            done
          fi

          # 4. Process and structure data.json, using inProductionAt for sorting
          echo "$raw_issues" | jq --argjson label_dates "$label_dates" '
            map(
              . as $item |
              ($item.number | tostring) as $numStr |
              ($item.labels | map(.name)) as $labels |

              # Normalize line endings and combine body + comments
              (
                [($item.body // "" | gsub("\r\n"; "\n"))] + 
                (if ($item.comments != null and ($item.comments | length > 0)) then [$item.comments[].body // "" | gsub("\r\n"; "\n")] else [] end)
              ) as $textBlocks |

              # Extract Resolution Details text
              (
                $textBlocks | map(
                  select(test("(?i)#+\\s*Resolution\\s+Details")) |
                  sub("(?s).*?(?i)#+\\s*Resolution\\s+Details:?\\s*\n?"; "") |
                  sub("(?s)\n#{1,2}\\s+[^#].*"; "") |
                  gsub("^\\s+|\\s+$"; "")
                ) | first // ""
              ) as $rawResText |

              # Extract [Module] prefix tag
              (if ($item.title | test("^\\[[^\\]]+\\]")) then ($item.title | capture("^\\[(?<mod>[^\\]]+)\\]") | .mod | gsub("^\\s+|\\s+$"; "")) else null end) as $moduleTag |

              # Clean base title
              ($item.title | gsub("^\\[[^\\]]*\\]"; "") | gsub("^\\s+|\\s+$"; "")) as $cleanTitle |

              # Extract custom title if present
              (if ($rawResText != "" and ($rawResText | test("^#+\\s+"; "m"))) then ($rawResText | capture("^#+\\s+(?<customTitle>[^\n]+)") | .customTitle | gsub("^\\s+|\\s+$"; "")) else $cleanTitle end) as $displayTitle |

              # Extract resolution body
              (if ($rawResText != "" and ($rawResText | test("^#+\\s+"; "m"))) then ($rawResText | sub("^#+\\s+[^\n]+\n?"; "") | gsub("^\\s+|\\s+$"; "")) else $rawResText end) as $resBody |

              # Categories
              ([$item.labels[].name | select(startswith("Category:")) | split(":")[1] | gsub("^\\s+|\\s+$"; "")]) as $cats |

              # Status flags
              (($labels | index("what'\''s new")) != null) as $hasWhatsNew |
              (($labels | index("in production")) != null) as $hasInProduction |
              (($labels | index("Status: Roadmap")) != null) as $hasRoadmap |

              # Exact timestamp when "in production" label was set (fallback to closedAt/updatedAt if missing)
              ($label_dates[$numStr] // $item.closedAt // $item.updatedAt) as $inProdDate |

              {
                id: .number,
                title: $displayTitle,
                module: $moduleTag,
                closedAt: ($item.closedAt // $item.updatedAt),
                inProductionAt: $inProdDate,
                categories: (if ($cats | length) > 0 then $cats else ["General"] end),
                resolutionText: $resBody,
                isPublished: ($hasWhatsNew and $hasInProduction and $item.state == "CLOSED"),
                isRoadmap: ($hasWhatsNew and $hasRoadmap)
              }
            ) | {
              # Sort published items in descending order based on inProductionAt timestamp
              published: (map(select(.isPublished) | del(.isPublished, .isRoadmap)) | sort_by(.inProductionAt) | reverse),
              roadmap: (map(select(.isRoadmap) | del(.isPublished, .isRoadmap)) | sort_by(.closedAt) | reverse)
            }
          ' > data.json

      - name: Commit and Push Updated Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "sync: update whats-new data ledger"
          branch: main
          file_pattern: 'data.json'
