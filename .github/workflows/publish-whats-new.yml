name: Sync What's New Feed

on:
  issues:
    types: [edited, closed, reopened, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]

jobs:
  sync-whats-new:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: read

    steps:
      - name: Checkout Public Page Repo
        uses: actions/checkout@v4
        with:
          repository: 'olga-dreamapply/whats-new-page'
          token: ${{ secrets.PUBLIC_DOCS_PAT }}
          ref: 'main'
          fetch-depth: 0

      - name: Fetch and Process Qualified Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          raw_issues=$(gh issue list --repo "$REPO" --state closed --limit 1000 --json number,title,labels,closedAt,body,comments)

          echo "$raw_issues" | jq '
            map(
              . as $item |
              ($item.labels | map(.name)) as $labels |

              # 1. Combine issue body, title, and comments into a searchable text block
              ([$item.title // "", $item.body // ""] + (($item.comments // []) | map(.body // ""))) as $allTexts |
              ($allTexts | join("\n\n")) as $combinedText |

              # 2. Extract module name from square brackets [ModuleName] anywhere in title or description
              (
                if $combinedText | test("\\[[^\\]]+\\]") then
                  ($combinedText | capture("\\[(?<mod>[^\\]]+)\\]") | .mod | gsub("^\\s+|\\s+$"; ""))
                else
                  null
                end
              ) as $moduleTag |

              # 3. Extract Resolution Details section
              (
                $allTexts | map(
                  select(test("#+\\s*Resolution Details"; "i")) |
                  sub("(?s).*?#+\\s*Resolution Details\\s*"; "") |
                  sub("(?s)\\s*#+.*"; "") |
                  gsub("^\\s+|\\s+$"; "")
                ) | first // ""
              ) as $rawResText |

              # 4. Clean base issue title by removing [Bracketed] text
              ($item.title | gsub("\\[[^\\]]*\\]"; "") | gsub("^\\s+|\\s+$"; "")) as $cleanTitle |

              # 5. Determine display title: Check if Resolution Details has a "### Title" line override
              (
                if $rawResText | test("^###\\s+"; "m") then
                  ($rawResText | capture("^###\\s+(?<customTitle>[^\n]+)") | .customTitle | gsub("^\\s+|\\s+$"; ""))
                else
                  $cleanTitle
                end
              ) as $displayTitle |

              # 6. Extract expandable body text (strip the custom ### title line if present)
              (
                if $rawResText | test("^###\\s+"; "m") then
                  ($rawResText | sub("^###\\s+[^\n]+\\n?"; "") | gsub("^\\s+|\\s+$"; ""))
                else
                  $rawResText
                end
              ) as $resBody |

              # 7. Extract Category labels
              (
                [$item.labels[].name | select(startswith("Category:")) | split(":")[1] | gsub("^\\s+|\\s+$"; "")]
              ) as $cats |

              # 8. Filter: Must have "in production" AND "what'\''s new"
              select(
                ($labels | index("in production")) != null and
                ($labels | index("what'\''s new")) != null
              ) | {
                id: .number,
                title: $displayTitle,
                module: $moduleTag,
                closedAt: .closedAt,
                categories: (if ($cats | length) > 0 then $cats else ["General"] end),
                resolutionText: $resBody
              }
            )
          ' > data.json

      - name: Safely Pull Remote Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git stash --include-untracked
          git pull --rebase origin main
          git stash pop || true

      - name: Commit and Push Updated Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "sync: update whats-new data ledger"
          branch: main
          file_pattern: 'data.json'
