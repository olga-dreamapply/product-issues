name: Sync What's New Feed

on:
  issues:
    types: [edited, closed, reopened, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]

jobs:
  sync-whats-new:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: read

    steps:
      - name: Checkout Public Page Repo
        uses: actions/checkout@v4
        with:
          repository: 'olga-dreamapply/whats-new-page'
          token: ${{ secrets.PUBLIC_DOCS_PAT }}
          ref: 'main'
          fetch-depth: 0

      - name: Fetch and Process Qualified Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          raw_issues=$(gh issue list --repo "$REPO" --state closed --limit 1000 --json number,title,labels,closedAt,body,comments)

          echo "$raw_issues" | jq '
            map(
              . as $item |
              ($item.labels | map(.name)) as $labels |

              ([$item.body // ""] + (($item.comments // []) | map(.body // ""))) as $allTexts |

              (
                $allTexts | map(
                  select(test("#+\\s*Resolution Details"; "i")) |
                  sub("(?s).*?#+\\s*Resolution Details\\s*"; "") |
                  sub("(?s)\\s*#+.*"; "") |
                  gsub("^\\s+|\\s+$"; "")
                ) | first // ""
              ) as $resText |

              (
                [$item.labels[].name | select(startswith("Category:")) | split(":")[1] | gsub("^\\s+|\\s+$"; "")]
              ) as $cats |

              select(
                ($labels | index("in production")) != null and
                ($labels | index("what'\''s new")) != null
              ) | {
                id: .number,
                title: (.title | gsub("\\[[^\\]]*\\]"; "") | gsub("^\\s+|\\s+$"; "")),
                closedAt: .closedAt,
                categories: (if ($cats | length) > 0 then $cats else ["General"] end),
                resolutionText: $resText
              }
            )
          ' > data.json

      # Step to sync remote changes before pushing
      - name: Pull Latest Changes
        run: |
          git pull --rebase origin main

      - name: Commit and Push Updated Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "sync: update whats-new data ledger"
          branch: main
          file_pattern: 'data.json'
