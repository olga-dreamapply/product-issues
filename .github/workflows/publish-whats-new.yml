Here is the updated `.github/workflows/publish-whats-new.yml` file with that safety guard applied.

### What Was Fixed

1. **Isolated Title Parsing:** The `jq` expression for extracting `module` now inspects **only** the `$item.title` string (`^\\[[^\\]]+\\]`). It completely ignores the issue description, comments, and the `## Resolution Details` section.
2. **Markdown Image Protection:** Images in markdown format (`![alt text](url)`) inside your resolution notes or comments will no longer trigger the module extractor.
3. **Clean Fallback:** If no `[Module]` is present at the beginning of the issue title, `moduleTag` returns `null`, and the `index.html` frontend gracefully falls back to displaying the assigned `Category:` label badge.

---

### Updated `.github/workflows/publish-whats-new.yml`

Replace the workflow file in your private **`product-issues`** repository with this code:

```yaml
name: Sync What's New Feed

on:
  issues:
    types: [edited, closed, reopened, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]

jobs:
  sync-whats-new:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: read

    steps:
      - name: Checkout Public Page Repo
        uses: actions/checkout@v4
        with:
          repository: 'olga-dreamapply/whats-new-page'
          token: ${{ secrets.PUBLIC_DOCS_PAT }}
          ref: 'main'
          fetch-depth: 0

      - name: Fetch and Process Qualified Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          raw_issues=$(gh issue list --repo "$REPO" --state closed --limit 1000 --json number,title,labels,closedAt,body,comments)

          echo "$raw_issues" | jq '
            map(
              . as $item |
              ($item.labels | map(.name)) as $labels |

              # 1. Gather issue body and all comments strictly for Resolution Details content
              ([$item.body // ""] + (($item.comments // []) | map(.body // ""))) as $bodyAndComments |

              # 2. Extract Resolution Details section text
              (
                $bodyAndComments | map(
                  select(test("#+\\s*Resolution Details"; "i")) |
                  sub("(?s).*?#+\\s*Resolution Details\\s*"; "") |
                  sub("(?s)\\s*#+.*"; "") |
                  gsub("^\\s+|\\s+$"; "")
                ) | first // ""
              ) as $rawResText |

              # 3. Extract [Module] STRICTLY from $item.title (Prevents matching ![Image Alt](url) in details)
              (
                if ($item.title | test("^\\[[^\\]]+\\]")) then
                  ($item.title | capture("^\\[(?<mod>[^\\]]+)\\]") | .mod | gsub("^\\s+|\\s+$"; ""))
                else
                  null
                end
              ) as $moduleTag |

              # 4. Clean base issue title by stripping leading [Module] tag
              ($item.title | gsub("^\\[[^\\]]*\\]"; "") | gsub("^\\s+|\\s+$"; "")) as $cleanTitle |

              # 5. Determine display title: Check if Resolution Details has an "### Title" line override
              (
                if ($rawResText != "" and ($rawResText | test("^###\\s+"; "m"))) then
                  ($rawResText | capture("^###\\s+(?<customTitle>[^\n]+)") | .customTitle | gsub("^\\s+|\\s+$"; ""))
                else
                  $cleanTitle
                end
              ) as $displayTitle |

              # 6. Extract expandable body text (strips the custom ### title line if present)
              (
                if ($rawResText != "" and ($rawResText | test("^###\\s+"; "m"))) then
                  ($rawResText | sub("^###\\s+[^\n]+\\n?"; "") | gsub("^\\s+|\\s+$"; ""))
                else
                  $rawResText
                end
              ) as $resBody |

              # 7. Extract Category labels
              (
                [$item.labels[].name | select(startswith("Category:")) | split(":")[1] | gsub("^\\s+|\\s+$"; "")]
              ) as $cats |

              # 8. Filter: Must contain BOTH "in production" AND "what'\''s new"
              select(
                ($labels | index("in production")) != null and
                ($labels | index("what'\''s new")) != null
              ) | {
                id: .number,
                title: $displayTitle,
                module: $moduleTag,
                closedAt: .closedAt,
                categories: (if ($cats | length) > 0 then $cats else ["General"] end),
                resolutionText: $resBody
              }
            )
          ' > data.json

      - name: Safely Pull Remote Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git stash --include-untracked
          git pull --rebase origin main
          git stash pop || true

      - name: Commit and Push Updated Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "sync: update whats-new data ledger"
          branch: main
          file_pattern: 'data.json'

```
